name: Backend Jobs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Run Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install black flake8 pylint
      - run: black --diff src/backend --exclude '/alembic/'
      - run: flake8 src/backend --exclude alembic
      - run: |
          pylint src/backend \
            --ignore=alembic \
            --disable=too-few-public-methods \
            --max-line-length=88 \
            --ignore-patterns=test_.*\.py


  test:
    name: Run Pytests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt pytest
      - run: echo "PYTHONPATH=src/backend" >> $GITHUB_ENV
      - run: pytest --maxfail=1 --disable-warnings -v